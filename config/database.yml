# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/bin/pg_config
#
#   Ensure the pg gem is defined in your Gemfile
#   gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  username: <%= ENV["DATABASE_USERNAME"] %>
  password: <%= ENV["DATABASE_PASSWORD"] %>

development:
  <<: *default
  database: analytics_dashboard_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: analytics_dashboard_test

# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  primary: &primary_production
    <<: *default
    database: analytics_dashboard_production
    username: analytics_dashboard
    password: <%= ENV["ANALYTICS_DASHBOARD_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: analytics_dashboard_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: analytics_dashboard_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: analytics_dashboard_production_cable
    migrations_paths: db/cable_migrate
